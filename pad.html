  <title>LR2099 Controller</title>
</head>
<body>
  <div id="app">
    <section id="join">
      <h1><span class="t1">LODE RUNNER</span> <span class="t2">2099</span></h1>
      <p class="sub">PHONE CONTROLLER</p>
      <form id="joinForm" autocomplete="off">
        <label>TV CODE <input id="code" maxlength="4" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="ABCD"></label>
        <label>NAME <input id="name" maxlength="24" placeholder="optional"></label>
        <div class="slots">
          <button type="submit" data-slot="1" class="p1">PLAYER 1</button>
          <button type="submit" data-slot="2" class="p2">PLAYER 2</button>
        </div>
        <p id="joinMsg" class="msg"></p>
        <p class="hint">Scan the QR on the TV, or type the 4-letter code shown on screen.</p>
        <p id="kbdJoin" class="hint" hidden>On a computer? After joining, play with your keyboard.</p>
      </form>
    </section>
    <section id="ctl" hidden>
      <div class="dpad" id="dpad"></div>
      <div class="mid">
        <div class="status"><b id="who">P1</b> <span id="conn">connecting…</span></div>
        <div id="info" class="info"></div>
        <div class="sys">
          <div class="tbtn sm" data-a="back">BACK</div>
          <div class="tbtn sm" data-a="pause">❚❚</div>
          <div class="tbtn sm" data-a="confirm">OK</div>
        </div>
        <p id="kbd" class="kbd" hidden>KEYBOARD: ARROWS / WASD move · Z X dig · P pause · ENTER ok · ESC back</p>
        <div class="row"><button id="switch" class="leave">⇄ SWITCH TV</button><button id="leave" class="leave">✕ LEAVE</button></div>
      </div>
      <div class="acts">
        <div class="tbtn big" id="actA"></div>
        <div class="tbtn big" id="actB"></div>
      </div>
    </section>
  </div>
  <script type="module" src="/src/pad/main.ts"></script>
</body>
</html>
